<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f0e3">
  <meta name="description" content="凌晨两点半，一间卖奇怪东西、收留奇怪生物的小店。免费带走一点周五下午，和猫店长交个朋友。">
  <meta property="og:title" content="两点半便利店 · 奇怪东西，正常营业">
  <meta property="og:description" content="雨还在下。店主不在，猫在值班。不买东西也可以待着。">
  <title>两点半便利店 · 奇怪东西，正常营业</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b554b'/%3E%3Cpath d='M14 26V10l14 10h8l14-10v16c8 27-44 27-36 0' fill='%23edba67'/%3E%3Cpath d='M23 34h3m12 0h3' stroke='%232b554b' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./content.js"></script>
  <script defer src="./state.js"></script>
  <script defer src="./scene.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#explore">跳到探索入口</a>
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="两点半便利店首页">
      <span class="logo-clock" aria-hidden="true">02<span>:</span>30</span>
      <span>两点半便利店<small>ODD THINGS. OPEN LATE.</small></span>
    </a>
    <nav class="top-nav" aria-label="店内导航">
      <button data-open="bestiary"><span aria-hidden="true">✧</span><span class="nav-label" data-short="图鉴">生物观察册</span> <small id="met-count">0</small></button>
      <button data-open="pocket"><span aria-hidden="true">⌑</span><span class="nav-label" data-short="口袋">我的口袋</span> <small id="pocket-count">0</small></button>
      <button class="audio-toggle" data-action="audio" aria-pressed="false" aria-label="开启雨声"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="sound-label">听一点雨</span></button>
    </nav>
  </header>

  <main>
    <section class="welcome" aria-labelledby="welcome-title">
      <div><p class="eyebrow"><span class="open-dot"></span> 奇怪东西，正常营业</p><h1 id="welcome-title">今晚，来点奇怪的。</h1></div>
      <p class="welcome-note">雨还在下。店主不在，猫在值班。<br>不买东西也可以待着。</p>
    </section>

    <section class="store-scene" aria-label="雨夜便利店，可以点击店里的物品和生物">
      <div id="scene-art" class="scene-art" aria-hidden="true"></div>
      <div class="scene-caption"><span class="tiny-star">✦</span> 无用之物专卖 · 不赶时间分店</div>
      <button class="hotspot shelf-spot mobile-spot" style="--x:30%;--y:63%" data-open="shelf"><span class="hotspot-pin">＋</span><span class="hotspot-label">逛逛货架</span></button>
      <button class="hotspot cat-spot mobile-spot" style="--x:52%;--y:72%" data-creature="cat"><span class="hotspot-pin">＋</span><span class="hotspot-label">猫店长</span></button>
      <button class="hotspot" style="--x:73%;--y:57%" data-creature="jelly"><span class="hotspot-pin">＋</span><span class="hotspot-label">冰柜有动静</span></button>
      <button class="hotspot" style="--x:91%;--y:53%" data-creature="pigeon"><span class="hotspot-pin">＋</span><span class="hotspot-label">未读鸽</span></button>
      <button class="hotspot" style="--x:33%;--y:86%" data-creature="moth"><span class="hotspot-pin">＋</span><span class="hotspot-label">谁在偷吃尴尬</span></button>
      <button class="hotspot" style="--x:12%;--y:88%" data-creature="snail" data-unlock="snail" hidden><span class="hotspot-pin">＋</span><span class="hotspot-label">新来的雨靴</span></button>
      <button class="hotspot" style="--x:18%;--y:79%" data-creature="hedgehog" data-unlock="hedgehog" hidden><span class="hotspot-pin">＋</span><span class="hotspot-label">星期三来串门</span></button>
      <button class="hotspot" style="--x:47%;--y:55%" data-open="radio"><span class="hotspot-pin">＋</span><span class="hotspot-label">听听深夜电台</span></button>
      <button class="hotspot news-spot mobile-spot" style="--x:11%;--y:67%" data-open="news"><span class="hotspot-pin">＋</span><span class="hotspot-label">深夜小报</span></button>
      <button class="hotspot fortune-spot mobile-spot" style="--x:86%;--y:77%" data-open="fortune"><span class="hotspot-pin">＋</span><span class="hotspot-label">摇一个莫名其妙</span></button>
      <button class="hotspot door-spot mobile-spot" style="--x:63%;--y:59%" data-open="backroom"><span class="hotspot-pin">＋</span><span class="hotspot-label" id="door-label">后门没上锁？</span></button>
      <button class="bell-button" data-action="bell" aria-label="按一下店门铃"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 21h18M7 19c2-4 1-11 7-11s5 7 7 11M12 24h4M14 5V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>叮咚</span></button>
      <div class="cat-bubble" id="cat-bubble" role="status">随便看看。别碰我的周末。</div>
      <p class="scene-weather">02:30 <span>小雨 / 局部掉落星期天</span></p>
    </section>

    <nav class="explore-bar" id="explore" aria-label="探索小店">
      <p><span class="paper-star">✳</span><span>想先去哪儿？<small>亮着的小圆点都可以碰一碰。</small></span></p>
      <div><button data-open="shelf">奇物货架 <span>↗</span></button><button data-open="bestiary">找小生物 <span>↗</span></button><button data-open="fortune">抽个怪签 <span>↗</span></button><button data-open="news">翻份小报 <span>↗</span></button></div>
    </nav>

    <section class="notice-row" aria-label="店门口的小纸条">
      <div class="notice-stamp">本店<br><strong>不催</strong></div>
      <p id="visit-note">你口袋里有空位，今晚也有。</p>
      <div class="notice-links"><button class="text-button" data-open="radio">听听深夜电台 <span>↗</span></button><button class="text-button" data-open="about">猫写的店规 <span>→</span></button></div>
    </section>
  </main>

  <footer class="site-footer"><span>没有必须完成的事。灯会一直亮着。</span><a href="/">沿原路回博客 ↗</a></footer>

  <dialog id="shop-dialog" aria-labelledby="dialog-title">
    <div class="dialog-toolbar"><button id="dialog-back" class="text-button" aria-label="返回上一页" hidden>← 回去看看</button><span id="dialog-kicker">两点半便利店</span><button class="close-button" data-action="close" aria-label="关上，继续逛店">×</button></div>
    <div id="dialog-toast" class="dialog-notice" role="status" aria-live="polite" hidden></div>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-note">小店的猫需要 JavaScript 才会说话。开启后就可以逛货架、认识生物和收集故事。</div></noscript>
</body>
</html>
